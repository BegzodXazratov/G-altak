<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tashkent City 3D</title>
<meta name="description" content="Tashkent City bo'ylab 3D sayr: binolar, park, ko'l va Nest One — OpenStreetMap ma'lumotlari asosida.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<style>
/* To'liq ekranli 3D; chap pastda joystik, o'ng pastda harakat tugmalari, o'ng yuqorida mini-xarita. */
:root{--glass:rgba(16,22,30,.62);--line:rgba(255,255,255,.16);--ink:#f3f5f7;--mute:#b7c0c9;--acc:#f2b33d;--font:"Manrope","Segoe UI",system-ui,sans-serif;
  --sl:max(12px,env(safe-area-inset-left,0px));--sr:max(12px,env(safe-area-inset-right,0px));--st:max(10px,env(safe-area-inset-top,0px));--sb:max(12px,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#9cc3de;overflow:hidden;font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
[hidden]{display:none!important}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.pill{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#top{position:fixed;left:var(--sl);top:var(--st);display:flex;gap:8px;align-items:center;z-index:5;max-width:calc(100% - 210px)}
#top .t{padding:8px 12px;font-weight:800;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .t small{display:block;font-weight:600;font-size:12px;color:var(--mute)}
#tools{position:fixed;left:var(--sl);top:calc(var(--st) + 56px);display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:60%}
#tools button{padding:8px 11px;font-weight:700;font-size:13px}
#mm{position:fixed;right:var(--sr);top:var(--st);z-index:5;padding:4px;cursor:pointer}
#mm canvas{display:block;border-radius:10px;width:170px;height:auto}
#mm.big canvas{width:min(78vw,520px)}
#toast{position:fixed;left:50%;top:calc(var(--st) + 110px);transform:translateX(-50%);padding:10px 16px;font-weight:700;font-size:14px;z-index:6;text-align:center;max-width:86vw;transition:opacity .3s}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);padding:4px 9px;border-radius:999px;background:rgba(16,22,30,.7);font-weight:700;font-size:12.5px;white-space:nowrap;border:1px solid var(--line)}
#joy{position:fixed;left:0;bottom:0;width:50%;height:55%;z-index:3}
#joyBase{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(16,22,30,.25);transform:translate(-50%,-50%);pointer-events:none;z-index:4}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75)}
#acts{position:fixed;right:var(--sr);bottom:var(--sb);display:flex;flex-direction:column;gap:10px;z-index:5;align-items:flex-end}
#acts button{width:64px;height:64px;border-radius:50%;font-weight:800;font-size:12.5px;line-height:1.1}
#acts button[aria-pressed="true"]{background:var(--acc);color:#1a1405;border-color:transparent}
#help{position:fixed;left:var(--sl);bottom:var(--sb);padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--mute);z-index:5;max-width:min(360px,60vw)}
#help b{color:var(--ink)}
#credit{position:fixed;right:var(--sr);bottom:4px;font-size:10.5px;color:rgba(255,255,255,.75);z-index:4;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#places{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,420px);max-height:72vh;overflow:auto;padding:14px;z-index:8;display:flex;flex-direction:column;gap:6px}
#places h2{margin:0 0 4px;font-size:18px}
#places button.pl{text-align:left;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-weight:700}
#places button.pl small{display:block;color:var(--mute);font-weight:600}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:#14202b;flex-direction:column;gap:10px;text-align:center;padding:20px}
#load h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
#load p{margin:0;color:var(--mute)}
#start{margin-top:8px;padding:13px 26px;border-radius:12px;background:var(--acc);color:#1a1405;font-weight:800;font-size:16px}
.touch #help{display:none}
body:not(.touch) #joy,body:not(.touch) #acts .tb{display:none}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="top"><div class="t pill">Tashkent City<small id="where">Shahar markazi</small></div></div>
<div id="tools"><button class="pill" id="bPlaces">📍 Joylar</button><button class="pill" id="bNight">🌙 Tun</button><button class="pill" id="bCam">🎥 1-shaxs</button></div>
<div id="mm" class="pill" title="Xarita"><canvas id="mmc"></canvas></div>
<div id="toast" class="pill" hidden></div>
<div id="joy"></div><div id="joyBase" hidden><div id="joyKnob"></div></div>
<div id="acts"><button class="pill tb" id="bJump">Sakrash</button><button class="pill tb" id="bRun" aria-pressed="false">Yugurish</button></div>
<div id="help" class="pill"><b>W A S D</b> yurish · <b>Shift</b> yugurish · <b>Probel</b> sakrash<br><b>Sichqoncha bilan torting</b> — atrofga qarash · <b>g'ildirak</b> — yaqin/uzoq<br><b>M</b> xarita · <b>N</b> tun · <b>V</b> kamera</div>
<div id="credit">Xarita: © OpenStreetMap ishtirokchilari</div>
<div id="places" class="pill" hidden></div>
<div id="load"><h1>Tashkent City</h1><p id="lmsg">Shahar qurilmoqda…</p><button id="start" hidden>Sayrni boshlash</button></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
